name: Bug report
description: 报告可复现的错误或不变量破坏
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现命令
      description: 请包含 seed、场景、策略和完整命令。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、CPU、Node.js 版本。
  - type: textarea
    id: output
    attributes:
      label: 输出或截图
  - type: checkboxes
    id: terms
    attributes:
      label: 检查
      options:
        - label: 我已确认相同 seed 可以复现该问题
          required: true
