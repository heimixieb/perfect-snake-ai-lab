# 可复现性 CI：每 push / PR 自动验证「发布的数字都能复现」。
#
# 设计说明：
# - 正确性判据使用固定 seed 与操作计数；墙钟只报告，不在共享 runner 上充当失败门；
# - 性能门请在固定硬件上运行完整本地基准，避免把 runner 抖动误判为算法回归；
# - bench:dyn 100 局用于验收报告数字，CI 用 20 局同 seed 序列（7000..7019）做回归门；
# - 大样本（A2 矩阵 / scale / shadow 100 局）不在 CI 跑：耗时超托管 runner 预算，
#   由 README 中的完整命令在本地复现。
name: reproducible-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (src + scripts, strict)
        run: npx tsc --noEmit

      - name: Build (dist/index.html single file)
        run: npm run build

      - name: Property test (10^4 ops, invariants per op)
        run: npx tsx scripts/property-test.ts 10000 42

      - name: Fault injection (40 games + coverage probes)
        run: npx tsx scripts/fault-test.ts 40 8000

      - name: Shadow refinement (8 games, four-layer assertions)
        run: npx tsx scripts/shadow-test.ts 8 9000

      - name: b-engine unit acceptance (2-factor, 50 layouts)
        run: npx tsx scripts/twofactor-test.ts 50 7000

      - name: Dynamic correctness gate (20 seeds; timing reported only)
        run: npx tsx scripts/bench-dyn.ts 20 7000 --correctness-only

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
