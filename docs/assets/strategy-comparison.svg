<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc"><title id="title">不同贪吃蛇算法的平均通关率</title><desc id="desc">基础、规则障碍和困难规则地图上的三组十局实验平均值。</desc><rect width="820" height="430" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#f8fafc" font-size="26" font-weight="700">不同走法，结果差多少？</text><text x="36" y="76" fill="#94a3b8" font-size="15">基础、规则障碍、困难规则地图 · 每组 10 局的平均通关率</text><text x="36" y="123" fill="#cbd5e1" font-size="18">贪心找食物</text><rect x="210" y="105" width="560" height="26" rx="8" fill="#1e293b"/><rect x="210" y="105" width="0" height="26" rx="8" fill="#38bdf8"/><text x="785" y="125" fill="#f8fafc" font-size="17" text-anchor="end">0%</text><text x="36" y="181" fill="#cbd5e1" font-size="18">安全找路</text><rect x="210" y="163" width="560" height="26" rx="8" fill="#1e293b"/><rect x="210" y="163" width="93" height="26" rx="8" fill="#38bdf8"/><text x="785" y="183" fill="#f8fafc" font-size="17" text-anchor="end">17%</text><text x="36" y="239" fill="#cbd5e1" font-size="18">固定环形路线</text><rect x="210" y="221" width="560" height="26" rx="8" fill="#1e293b"/><rect x="210" y="221" width="560" height="26" rx="8" fill="#10b981"/><text x="785" y="241" fill="#f8fafc" font-size="17" text-anchor="end">100%</text><text x="36" y="297" fill="#cbd5e1" font-size="18">环形路线＋近路</text><rect x="210" y="279" width="560" height="26" rx="8" fill="#1e293b"/><rect x="210" y="279" width="560" height="26" rx="8" fill="#10b981"/><text x="785" y="299" fill="#f8fafc" font-size="17" text-anchor="end">100%</text><text x="36" y="355" fill="#cbd5e1" font-size="18">自动选择路线</text><rect x="210" y="337" width="560" height="26" rx="8" fill="#1e293b"/><rect x="210" y="337" width="560" height="26" rx="8" fill="#10b981"/><text x="785" y="357" fill="#f8fafc" font-size="17" text-anchor="end">100%</text><text x="36" y="405" fill="#64748b" font-size="13">实验结果只代表给定地图、版本和种子，不代表所有地图。</text></svg>